"$schema" = 'https://starship.rs/config-schema.json'

# Main Left Prompt
format = """
[](fg:#1e1f25)\
$username\
[](fg:#1e1f25 bg:#b5c4ff)\
$directory\
[](fg:#b5c4ff bg:#45464f)\
$git_branch\
$git_status\
[](fg:#45464f bg:#c1c5dd)\
$c$rust$golang$nodejs$java$kotlin$python\
[](fg:#c1c5dd)\
$cmd_duration\
$line_break$character"""

[username]
show_always = true
style_user = "bg:#1e1f25 fg:#b5c4ff"
style_root = "bg:#1e1f25 fg:#ffb4ab"
format = '[ $user ]($style)'

[directory]
style = "bg:#b5c4ff fg:#121318"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "  "
style = "bg:#45464f fg:#c6c6d0"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#45464f fg:#ffb4ab"
format = '[$all_status$ahead_behind]($style)'

# Language Modules
[nodejs]
symbol = "  nodejs"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[c]
symbol = "  c"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[rust]
symbol = "  rust"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[golang]
symbol = "  golang"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[python]
symbol = "  python"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[java]
symbol = "  java"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[kotlin]
symbol = "  kotlin"
style = "bg:#c1c5dd fg:#2b3042"
format = '[$symbol]($style)'

[cmd_duration]
min_time = 1
show_milliseconds = false
style = "bg:#000000 fg:#b5c4ff"
format = '[](fg:#000000)[ 󱎫 $duration ]($style)[](fg:#000000)'

[character]
success_symbol = '[ ](bold fg:#b5c4ff)'
error_symbol = '[ ](bold fg:#ffb4ab)'
