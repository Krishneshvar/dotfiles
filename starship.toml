"$schema" = 'https://starship.rs/config-schema.json'

# Main Left Prompt
format = """
[](fg:#261e18)\
$username\
[](fg:#261e18 bg:#fcb975)\
$directory\
[](fg:#fcb975 bg:#51453a)\
$git_branch\
$git_status\
[](fg:#51453a bg:#e1c1a4)\
$c$rust$golang$nodejs$java$kotlin$python\
[](fg:#e1c1a4)\
$cmd_duration\
$line_break$character"""

[username]
show_always = true
style_user = "bg:#261e18 fg:#fcb975"
style_root = "bg:#261e18 fg:#ffb4ab"
format = '[ $user ]($style)'

[directory]
style = "bg:#fcb975 fg:#19120c"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "  "
style = "bg:#51453a fg:#d5c3b5"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#51453a fg:#ffb4ab"
format = '[$all_status$ahead_behind]($style)'

# Language Modules
[nodejs]
symbol = "  nodejs"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[c]
symbol = "  c"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[rust]
symbol = "  rust"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[golang]
symbol = "  golang"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[python]
symbol = "  python"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[java]
symbol = "  java"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[kotlin]
symbol = "  kotlin"
style = "bg:#e1c1a4 fg:#402c18"
format = '[$symbol]($style)'

[cmd_duration]
min_time = 1
show_milliseconds = false
style = "bg:#000000 fg:#fcb975"
format = '[](fg:#000000)[ 󱎫 $duration ]($style)[](fg:#000000)'

[character]
success_symbol = '[ ](bold fg:#fcb975)'
error_symbol = '[ ](bold fg:#ffb4ab)'
