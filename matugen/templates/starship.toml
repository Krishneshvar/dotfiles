"$schema" = 'https://starship.rs/config-schema.json'

# Main Left Prompt
format = """
[](fg:{{colors.surface_container.default.hex}})\
$username\
[](fg:{{colors.surface_container.default.hex}} bg:{{colors.primary.default.hex}})\
$directory\
[](fg:{{colors.primary.default.hex}} bg:{{colors.surface_variant.default.hex}})\
$git_branch\
$git_status\
[](fg:{{colors.surface_variant.default.hex}} bg:{{colors.secondary.default.hex}})\
$c$rust$golang$nodejs$java$kotlin$python\
[](fg:{{colors.secondary.default.hex}})\
$cmd_duration\
$line_break$character"""

[username]
show_always = true
style_user = "bg:{{colors.surface_container.default.hex}} fg:{{colors.primary.default.hex}}"
style_root = "bg:{{colors.surface_container.default.hex}} fg:{{colors.error.default.hex}}"
format = '[ $user ]($style)'

[directory]
style = "bg:{{colors.primary.default.hex}} fg:{{colors.background.default.hex}}"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = "  "
style = "bg:{{colors.surface_variant.default.hex}} fg:{{colors.on_surface_variant.default.hex}}"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:{{colors.surface_variant.default.hex}} fg:{{colors.error.default.hex}}"
format = '[$all_status$ahead_behind]($style)'

# Language Modules
[nodejs]
symbol = "  nodejs"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[c]
symbol = "  c"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[rust]
symbol = "  rust"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[golang]
symbol = "  golang"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[python]
symbol = "  python"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[java]
symbol = "  java"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[kotlin]
symbol = "  kotlin"
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
format = '[$symbol]($style)'

[cmd_duration]
min_time = 1
show_milliseconds = false
style = "bg:#000000 fg:{{colors.primary.default.hex}}"
format = '[](fg:#000000)[ 󱎫 $duration ]($style)[](fg:#000000)'

[character]
success_symbol = '[ ](bold fg:{{colors.primary.default.hex}})'
error_symbol = '[ ](bold fg:{{colors.error.default.hex}})'
