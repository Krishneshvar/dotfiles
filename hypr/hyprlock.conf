source = ~/.config/matugen/generated/hyprlock.conf

$font = Inter, JetBrainsMono Nerd Font, sans-serif

# GENERAL
general {
    hide_cursor = false
    fail_timeout = 500
    ignore_empty_input = true
}

# BACKGROUND (Uses current screen content with Gaussian blur and subtle dark scrim)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    color = $bg
}

# TIME (Large minimal clean clock)
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 84
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# DAY & DATE (Accent color, clear visual hierarchy)
label {
    monitor =
    text = cmd[update:60000] date +"%A • %B %d, %Y"
    color = $accent
    font_size = 16
    font_family = $font
    position = 0, 85
    halign = center
    valign = center
}

# INPUT FIELD (Centered minimal password input)
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    fade_on_empty = false
    placeholder_text = $placeholder_markup
    hide_input = false
    check_color = $success
    fail_color = $error
    fail_text = <i>Authentication failed ($ATTEMPTS)</i>
    capslock_color = $warning
    position = 0, -25
    halign = center
    valign = center
}

# MEDIA STATUS (Shows track and artist if music is playing/paused)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/media.sh
    color = $fg_muted
    font_size = 13
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# TOP BAR: BATTERY (Top-Right)
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    color = $fg
    font_size = 13
    font_family = $font
    position = -30, -25
    halign = right
    valign = top
}

# TOP BAR: VOLUME (Next to Battery on Top-Right)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/volume.sh
    color = $fg
    font_size = 13
    font_family = $font
    position = -115, -25
    halign = right
    valign = top
}
